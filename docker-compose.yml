services:
  postgres:
    image: postgres:16
    container_name: launchmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: launchmate
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d launchmate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
